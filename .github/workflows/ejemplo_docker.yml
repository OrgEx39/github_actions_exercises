name: Ejemplo Docker Action

on:
  workflow_dispatch:

jobs:
  saludar:
    name: Ejecutar acción Docker
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Ejecutar acción personalizada
        uses: ./.github/actions/saludar
        with:
          nombre: Antonio